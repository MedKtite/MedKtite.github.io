@if (isHome) {
  <footer class="site-footer site-footer--home">
    <p>© {{ year }} {{ profile.name }}</p>
    <p>{{ i18n.t(profile.credit) }}</p>
  </footer>
} @else {
  <footer class="site-footer site-footer--page">
    <p class="copyright">© {{ year }} {{ profile.name }}</p>
    <nav class="footer-links" aria-label="Contact">
      @for (link of links; track link.icon) {
        <a
          class="underline-link"
          [href]="i18n.t(link.href)"
          [attr.target]="link.external ? '_blank' : null"
          [attr.rel]="link.external ? 'noopener' : null"
          >{{ i18n.t(link.label) }}</a
        >
      }
    </nav>
  </footer>
}
